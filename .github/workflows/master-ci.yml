name: Fleet Master CI

on:
  workflow_call:
    inputs:
      go_version:
        required: false
        type: string
        default: '1.25'
      python_version:
        required: false
        type: string
        default: '3.12'
      node_version:
        required: false
        type: string
        default: '20'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOPRIVATE: 'github.com/Bastien-Antigravity/*'

jobs:
  discovery:
    name: Ecosystem Discovery
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Languages
        id: set-matrix
        run: |
          langs="["
          
          # Go detection
          if [ -n "$(find . -maxdepth 3 -name 'go.mod' 2>/dev/null)" ]; then
            langs="${langs}\"go\","
          fi
          
          # Python detection
          if [ -n "$(find . -maxdepth 3 -name 'requirements.txt' -o -name 'pyproject.toml' -o -name 'setup.py' 2>/dev/null)" ]; then
            langs="${langs}\"python\","
          fi
          
          # Rust detection
          if [ -n "$(find . -maxdepth 3 -name 'Cargo.toml' 2>/dev/null)" ]; then
            langs="${langs}\"rust\","
          fi
          
          # C/C++ detection
          if [ -n "$(find . -maxdepth 4 -name 'CMakeLists.txt' -o -name '*.cpp' -o -name '*.hpp' 2>/dev/null)" ]; then
            langs="${langs}\"cpp\","
          fi
          
          # Node/JS detection
          if [ -n "$(find . -maxdepth 3 -name 'package.json' -not -path '*/node_modules/*' 2>/dev/null)" ]; then
            langs="${langs}\"js\","
          fi
          
          # Clean trailing comma and close array
          langs="${langs%,}"
          langs="${langs}]"
          if [ "$langs" = "]" ]; then langs="[]"; fi
          
          echo "Discovered ecosystems: $langs"
          echo "matrix=$langs" >> $GITHUB_OUTPUT

  polyglot-matrix:
    name: Test (${{ matrix.language }})
    needs: discovery
    runs-on: ubuntu-latest
    if: ${{ needs.discovery.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.discovery.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # SHARED CGO PRE-REQUISITE (Many polyglot SDKs wrap Go Core)
      # ---------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Build Core CGO Libraries (Dependencies)
        if: matrix.language != 'go'
        run: |
          if [ -f Makefile ] && grep -q "^build-lib:" Makefile 2>/dev/null; then
            make build-lib || true
          elif [ -f Makefile ] && grep -q "^core:" Makefile 2>/dev/null; then
            make core || true
          else
            echo "No CGO build target found in Makefile, skipping."
          fi

      # ---------------------------------------------------------
      # GO ECOSYSTEM
      # ---------------------------------------------------------
      - name: Go Native Checks & Tests
        if: matrix.language == 'go'
        run: |
          for dir in $(find . -maxdepth 3 -name "go.mod" -exec dirname {} \; | sort -u); do
            echo "========================================"
            echo "Testing Go in $dir"
            echo "========================================"
            cd "$dir"
            if [ -f go.mod ]; then
              grep -E '=> \.\./' go.mod | while read -r line; do
                target=$(echo "$line" | awk '{print $NF}')
                mod=$(echo "$line" | awk '{print $1}')
                if [ ! -d "$target" ]; then
                  echo "Removing missing local replace in CI: $mod -> $target"
                  go mod edit -dropreplace "$mod" || true
                fi
              done
            fi
            unformatted=$(gofmt -l . 2>/dev/null | tr -d ' ')
            if [ -n "$unformatted" ]; then
              echo "Unformatted files found in $dir:"
              gofmt -d .
            else
              echo "All Go files in $dir are properly formatted."
            fi
            go test -v ./... || go test -v ./src/... || true
            cd - > /dev/null
          done

      # ---------------------------------------------------------
      # PYTHON ECOSYSTEM
      # ---------------------------------------------------------
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Python Tests
        if: matrix.language == 'python'
        run: |
          pip install pytest build setuptools wheel || true
          for dir in $(find . -maxdepth 3 -name "requirements.txt" -o -name "pyproject.toml" -o -name "setup.py" -exec dirname {} \; | sort -u); do
            echo "========================================"
            echo "Testing Python in $dir"
            echo "========================================"
            cd "$dir"
            
            # Install local dependencies
            if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install -e . || true; fi
            if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
            
            # Run pytest with graceful fallback if 0 tests found
            pytest || true
            
            cd - > /dev/null
          done

      # ---------------------------------------------------------
      # RUST ECOSYSTEM
      # ---------------------------------------------------------
      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust Tests
        if: matrix.language == 'rust'
        run: |
          for dir in $(find . -maxdepth 3 -name "Cargo.toml" -exec dirname {} \; | sort -u); do
            echo "========================================"
            echo "Testing Rust in $dir"
            echo "========================================"
            cd "$dir"
            cargo test --verbose || true
            cd - > /dev/null
          done

      # ---------------------------------------------------------
      # NODE / JS ECOSYSTEM
      # ---------------------------------------------------------
      - name: Set up Node.js
        if: matrix.language == 'js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Node Tests
        if: matrix.language == 'js'
        run: |
          for dir in $(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | sort -u); do
            echo "========================================"
            echo "Testing Node in $dir"
            echo "========================================"
            cd "$dir"
            npm ci || npm install || true
            npm test --if-present || true
            cd - > /dev/null
          done

      # ---------------------------------------------------------
      # C++ ECOSYSTEM
      # ---------------------------------------------------------
      - name: CPP Tests
        if: matrix.language == 'cpp'
        run: |
          for dir in $(find . -maxdepth 3 -name "Makefile" -exec dirname {} \; | sort -u); do
            if [ "$dir" = "." ]; then continue; fi
            if find "$dir" -maxdepth 2 \( -name "*.cpp" -o -name "*.cc" -o -name "*.c" \) | grep -q .; then
              if grep -q "^test:" "$dir/Makefile" 2>/dev/null; then
                echo "========================================"
                echo "Building/Testing CPP in $dir"
                echo "========================================"
                cd "$dir"
                make test || true
                cd - > /dev/null
              fi
            fi
          done

      # ---------------------------------------------------------
      # FLEET INTEGRATION & DISPATCH
      # ---------------------------------------------------------
      - name: Trigger Sandbox Verification
        if: matrix.language == 'go' && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          if [ -n "${{ secrets.FLEET_ACCESS_TOKEN }}" ]; then
            echo "📡 Dispatching fleet-event to sandbox-testing..."
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.FLEET_ACCESS_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Bastien-Antigravity/sandbox-testing/dispatches \
              -d '{"event_type": "fleet-event", "client_payload": {"repo": "${{ github.repository }}", "branch": "${{ github.ref_name }}"}}' || true
          else
            echo "FLEET_ACCESS_TOKEN secret not present, skipping sandbox dispatch."
          fi
