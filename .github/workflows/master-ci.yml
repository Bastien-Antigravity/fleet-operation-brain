name: Fleet Master CI

on:
  workflow_call:
    inputs:
      go_version:
        required: false
        type: string
        default: '1.25'
      python_version:
        required: false
        type: string
        default: '3.12'
      node_version:
        required: false
        type: string
        default: '20'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOPRIVATE: 'github.com/Bastien-Antigravity/*'

jobs:
  discovery:
    name: Ecosystem Discovery
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Languages
        id: set-matrix
        run: |
          langs="["

          # Go detection
          if [ -n "$(find . -maxdepth 3 -name 'go.mod' 2>/dev/null)" ]; then
            langs="${langs}\"go\","
          fi

          # Python detection
          if [ -n "$(find . -maxdepth 3 \( -name 'requirements.txt' -o -name 'pyproject.toml' -o -name 'setup.py' \) 2>/dev/null)" ] || [ -d "scripts/tests" ]; then
            langs="${langs}\"python\","
          fi

          # Rust detection
          if [ -n "$(find . -maxdepth 3 -name 'Cargo.toml' 2>/dev/null)" ]; then
            langs="${langs}\"rust\","
          fi

          # C/C++ detection
          if [ -n "$(find . -maxdepth 4 \( -name 'CMakeLists.txt' -o -name '*.cpp' -o -name '*.hpp' \) 2>/dev/null)" ]; then
            langs="${langs}\"cpp\","
          fi

          # Node/JS detection
          if [ -n "$(find . -maxdepth 3 -name 'package.json' -not -path '*/node_modules/*' 2>/dev/null)" ]; then
            langs="${langs}\"js\","
          fi

          # Clean trailing comma and close array
          langs="${langs%,}"
          langs="${langs}]"
          if [ "$langs" = "]" ]; then langs="[]"; fi

          echo "Discovered ecosystems: $langs"
          echo "matrix=$langs" >> $GITHUB_OUTPUT

  polyglot-matrix:
    name: Test (${{ matrix.language }})
    needs: discovery
    runs-on: ubuntu-latest
    if: ${{ needs.discovery.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.discovery.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # SHARED CGO PRE-REQUISITE (Many polyglot SDKs wrap Go Core)
      # ---------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Configure Private Go Module Auth
        env:
          GH_TOKEN: ${{ secrets.FLEET_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/Bastien-Antigravity/".insteadOf "https://github.com/Bastien-Antigravity/"
          fi

      - name: Build Core CGO Libraries (Dependencies)
        if: matrix.language != 'go'
        run: |
          if [ -f Makefile ] && grep -qE "^(build-lib|core)\b.*:" Makefile 2>/dev/null; then
            if grep -qE "^build-lib\b.*:" Makefile 2>/dev/null; then
              make build-lib
            else
              make core
            fi
          else
            echo "No CGO build target found in Makefile, skipping."
          fi

      # ---------------------------------------------------------
      # GO ECOSYSTEM
      # ---------------------------------------------------------
      - name: Go Native Checks & Tests
        if: matrix.language == 'go'
        run: |
          while IFS= read -r gomod; do
            dir=$(dirname "$gomod")
            echo "========================================"
            echo "Testing Go in $dir"
            echo "========================================"
            pushd "$dir" > /dev/null

            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "ERROR: Unformatted Go files found in $dir:"
              echo "$unformatted"
              gofmt -d .
              exit 1
            else
              echo "All Go files in $dir are properly formatted."
            fi

            dropped_replace=false
            if [ -f go.mod ]; then
              while IFS= read -r line; do
                target=$(echo "$line" | awk '{print $NF}')
                if echo "$line" | awk '{print $1}' | grep -qx "replace"; then
                  mod=$(echo "$line" | awk '{print $2}')
                else
                  mod=$(echo "$line" | awk '{print $1}')
                fi
                if [ -n "$mod" ] && [ ! -d "$target" ]; then
                  echo "Removing missing local replace in CI: $mod -> $target"
                  go mod edit -dropreplace "$mod"
                  dropped_replace=true
                fi
              done < <(grep -E '=>[[:space:]]+\.\./' go.mod || true)
            fi

            if [ "$dropped_replace" = true ]; then
              echo "Refreshing go.sum after dropping missing local replace directives..."
              GOWORK=off go mod tidy
            fi

            if [ -f go.sum ]; then
              GOWORK=off go mod verify
            fi

            GOWORK=off go build ./...
            GOWORK=off go test -v ./...

            popd > /dev/null
          done < <(find . -maxdepth 3 -name "go.mod" | sort -u)

      # ---------------------------------------------------------
      # PYTHON ECOSYSTEM
      # ---------------------------------------------------------
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Python Tests
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip pytest build setuptools wheel
          ran_root_tests=false
          while IFS= read -r dir; do
            echo "========================================"
            echo "Testing Python in $dir"
            echo "========================================"
            pushd "$dir" > /dev/null

            # Install local dependencies
            if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install -e .; fi
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

            # Run pytest; allow ONLY exit code 0 (pass) or 5 (no tests collected)
            rc=0
            pytest || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
              exit "$rc"
            fi
            if [ "$dir" = "." ]; then
              ran_root_tests=true
            fi

            popd > /dev/null
          done < <(find . -maxdepth 3 \( -name "requirements.txt" -o -name "pyproject.toml" -o -name "setup.py" \) -exec dirname {} \; | sort -u)

          if [ -d "scripts/tests" ] && [ "$ran_root_tests" = false ]; then
            echo "========================================"
            echo "Testing Python unittest in scripts/tests"
            echo "========================================"
            python3 -m unittest discover -s scripts/tests
          fi

      # ---------------------------------------------------------
      # RUST ECOSYSTEM
      # ---------------------------------------------------------
      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install System Protoc & Capnp
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev capnproto

      - name: Rust Tests
        if: matrix.language == 'rust'
        run: |
          while IFS= read -r dir; do
            echo "========================================"
            echo "Testing Rust in $dir"
            echo "========================================"
            pushd "$dir" > /dev/null
            cargo test --verbose
            popd > /dev/null
          done < <(find . -maxdepth 3 -name "Cargo.toml" -exec dirname {} \; | sort -u)

      # ---------------------------------------------------------
      # NODE / JS ECOSYSTEM
      # ---------------------------------------------------------
      - name: Set up Node.js
        if: matrix.language == 'js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Node Tests
        if: matrix.language == 'js'
        run: |
          while IFS= read -r dir; do
            echo "========================================"
            echo "Testing Node in $dir"
            echo "========================================"
            pushd "$dir" > /dev/null
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm test --if-present
            popd > /dev/null
          done < <(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | sort -u)

      # ---------------------------------------------------------
      # C++ ECOSYSTEM
      # ---------------------------------------------------------
      - name: CPP Tests
        if: matrix.language == 'cpp'
        run: |
          while IFS= read -r dir; do
            if [ "$dir" = "." ]; then continue; fi
            if find "$dir" -maxdepth 2 \( -name "*.cpp" -o -name "*.cc" -o -name "*.c" \) | grep -q .; then
              if grep -q "^test:" "$dir/Makefile" 2>/dev/null; then
                echo "========================================"
                echo "Building/Testing CPP in $dir"
                echo "========================================"
                pushd "$dir" > /dev/null
                make test
                popd > /dev/null
              fi
            fi
          done < <(find . -maxdepth 3 -name "Makefile" -exec dirname {} \; | sort -u)

      # ---------------------------------------------------------
      # FLEET INTEGRATION & DISPATCH
      # ---------------------------------------------------------
      - name: Trigger Sandbox Verification
        if: matrix.language == 'go' && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          if [ -n "${{ secrets.FLEET_ACCESS_TOKEN }}" ]; then
            echo "📡 Dispatching fleet-event to sandbox-testing..."
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.FLEET_ACCESS_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Bastien-Antigravity/sandbox-testing/dispatches \
              -d '{"event_type": "fleet-event", "client_payload": {"repo": "${{ github.repository }}", "branch": "${{ github.ref_name }}"}}' || true
          else
            echo "FLEET_ACCESS_TOKEN secret not present, skipping sandbox dispatch."
          fi
