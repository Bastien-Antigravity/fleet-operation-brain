name: Fleet Master CI

on:
  workflow_call:
    inputs:
      go_version:
        required: false
        type: string
        default: '1.25'
      python_version:
        required: false
        type: string
        default: '3.12'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discovery:
    name: Ecosystem Discovery
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Languages
        id: set-matrix
        run: |
          langs="["
          
          # Go detection
          if [ -n "$(find . -maxdepth 3 -name 'go.mod')" ]; then
            langs="${langs}\"go\","
          fi
          
          # Python detection
          if [ -n "$(find . -maxdepth 3 -name 'requirements.txt' -o -name 'pyproject.toml' -o -name 'setup.py')" ]; then
            langs="${langs}\"python\","
          fi
          
          # Rust detection
          if [ -n "$(find . -maxdepth 3 -name 'Cargo.toml')" ]; then
            langs="${langs}\"rust\","
          fi
          
          # C/C++ detection
          if [ -n "$(find . -maxdepth 4 -name 'CMakeLists.txt' -o -name '*.cpp' -o -name '*.hpp')" ]; then
            langs="${langs}\"cpp\","
          fi
          
          # Clean trailing comma and close array
          langs="${langs%,}"
          langs="${langs}]"
          if [ "$langs" = "]" ]; then langs="[]"; fi
          
          echo "Discovered ecosystems: $langs"
          echo "matrix=$langs" >> $GITHUB_OUTPUT

  polyglot-matrix:
    name: Test (${{ matrix.language }})
    needs: discovery
    runs-on: ubuntu-latest
    if: ${{ needs.discovery.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.discovery.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # SHARED CGO PRE-REQUISITE (Many polyglot SDKs wrap Go Core)
      # ---------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Build Core CGO Libraries (Dependencies)
        if: matrix.language != 'go'
        run: |
          if grep -q "^build-lib:" Makefile 2>/dev/null; then
            make build-lib
          elif grep -q "^core:" Makefile 2>/dev/null; then
            make core
          fi

      # ---------------------------------------------------------
      # GO ECOSYSTEM
      # ---------------------------------------------------------
      - name: Go Native Checks & Tests
        if: matrix.language == 'go'
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then echo "Unformatted files found"; gofmt -d .; exit 1; fi
          if [ -f go.mod ]; then
            echo "Removing relative replacements from go.mod for CI..."
            grep -E "=>\s*\.\./" go.mod | awk '{print $1}' | while read -r dep; do
              echo "Dropping replacement for: $dep"
              go mod edit -dropreplace="$dep"
            done
          fi
          go mod tidy || true
          go test -v -race ./...

      # ---------------------------------------------------------
      # PYTHON ECOSYSTEM
      # ---------------------------------------------------------
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Python Tests
        if: matrix.language == 'python'
        run: |
          pip install pytest build setuptools wheel
          for dir in $(find . -maxdepth 3 -name "requirements.txt" -o -name "pyproject.toml" -o -name "setup.py" -exec dirname {} \; | sort -u); do
            echo "========================================"
            echo "Testing Python in $dir"
            echo "========================================"
            cd "$dir"
            
            # Install local dependencies
            if [ -f setup.py ] || [ -f pyproject.toml ]; then pip install -e . || true; fi
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            
            # Run pytest
            pytest
            
            cd - > /dev/null
          done

      # ---------------------------------------------------------
      # RUST ECOSYSTEM
      # ---------------------------------------------------------
      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust Tests
        if: matrix.language == 'rust'
        run: |
          for dir in $(find . -maxdepth 3 -name "Cargo.toml" -exec dirname {} \; | sort -u); do
            echo "========================================"
            echo "Testing Rust in $dir"
            echo "========================================"
            cd "$dir"
            cargo test --verbose
            cd - > /dev/null
          done

      # ---------------------------------------------------------
      # C++ ECOSYSTEM
      # ---------------------------------------------------------
      - name: CPP Tests
        if: matrix.language == 'cpp'
        run: |
          for dir in $(find . -maxdepth 3 -name "Makefile" -exec dirname {} \; | sort -u); do
            # Skip root directory
            if [ "$dir" = "." ]; then continue; fi
            
            # Check if this Makefile directory actually contains C/C++ source files
            if find "$dir" -maxdepth 2 \( -name "*.cpp" -o -name "*.cc" -o -name "*.c" \) | grep -q .; then
              if grep -q "^test:" "$dir/Makefile" 2>/dev/null; then
                echo "========================================"
                echo "Building/Testing CPP in $dir"
                echo "========================================"
                cd "$dir"
                make test
                cd - > /dev/null
              fi
            else
              echo "Skipping non-C++ Makefile directory: $dir"
            fi
          done

      # ---------------------------------------------------------
      # FLEET INTEGRATION
      # ---------------------------------------------------------
      - name: Trigger Sandbox Verification
        if: matrix.language == 'go' && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          echo "📡 Dispatching fleet-event to sandbox-testing..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FLEET_ACCESS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Bastien-Antigravity/sandbox-testing/dispatches \
            -d '{"event_type": "fleet-event", "client_payload": {"repo": "${{ github.repository }}", "branch": "${{ github.ref_name }}"}}'
