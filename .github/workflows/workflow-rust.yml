name: Fleet Rust CI

on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        type: string
        default: '.'
      rust_version:
        required: false
        type: string
        default: '1.91'
      go_version:
        required: false
        type: string
        default: '1.25'
      artifact_name:
        description: "Name of the shared library artifact to download (optional)"
        required: false
        type: string
        default: ''
      artifact_path:
        description: "Path where the artifact should be downloaded"
        required: false
        type: string
        default: 'libs/'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Rust Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go (For CGO Bridge)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      - name: Download Dependency Artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}

      - name: Checkout Distributed Config (If External Consumer)
        if: github.repository != 'Bastien-Antigravity/distributed-config' && inputs.artifact_name == 'libdistconf'
        uses: actions/checkout@v6
        with:
          repository: Bastien-Antigravity/distributed-config
          path: distributed-config
          ref: develop

      - name: Build Distributed Config Library (If External Consumer)
        if: github.repository != 'Bastien-Antigravity/distributed-config' && inputs.artifact_name == 'libdistconf'
        working-directory: distributed-config
        run: make build-lib

      - name: Build CGO Bridges
        run: |
          if [ -f Makefile ]; then
            if grep -q "^core:" Makefile 2>/dev/null; then make core; elif grep -q "^build:" Makefile 2>/dev/null; then make build; fi
          elif [ -f ../Makefile ]; then
            if grep -q "^core:" ../Makefile 2>/dev/null; then make -C .. core; elif grep -q "^build:" ../Makefile 2>/dev/null; then make -C .. build; fi
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_version }}

      - name: Test Rust SDK
        env:
          LIBDISTCONF_PATH: ${{ github.repository == 'Bastien-Antigravity/distributed-config' && format('{0}/distconf/libdistconf/libdistconf.so', github.workspace) || format('{0}/distributed-config/distconf/libdistconf/libdistconf.so', github.workspace) }}
          LIB_PATH: ${{ inputs.artifact_path }}
        run: cargo test
