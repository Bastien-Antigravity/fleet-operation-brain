name: Fleet Go CI

on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        type: string
        default: '.'
      go_version:
        required: false
        type: string
        default: '1.25'

jobs:
  verify:
    name: Go Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Go Format Check
        run: if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then echo "Unformatted files found"; gofmt -d .; exit 1; fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: ${{ inputs.working_directory }}

      - name: Run Go Tests
        run: |
          go mod tidy
          go test -v -race ./...

      - name: Trigger Sandbox Verification
        if: inputs.working_directory == '.' && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          echo "📡 Dispatching fleet-event to sandbox-testing..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FLEET_ACCESS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Bastien-Antigravity/sandbox-testing/dispatches \
            -d '{"event_type": "fleet-event", "client_payload": {"repo": "${{ github.repository }}", "branch": "${{ github.ref_name }}"}}'
