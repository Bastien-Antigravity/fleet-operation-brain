# [FLEET-ARCHITECT] Standardized Polyglot CI
name: Polyglot CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

env:
  GOTOOLCHAIN: auto

jobs:
  go-ci:
    name: Go Tests
    runs-on: ubuntu-latest
    # Only run if go.mod exists in root
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for go.mod
        id: check_go
        run: |
          if [ -f go.mod ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.check_go.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Go Tests
        if: steps.check_go.outputs.exists == 'true'
        run: |
          go mod tidy
          go test -v ./...

      - name: Run golangci-lint
        if: steps.check_go.outputs.exists == 'true'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
