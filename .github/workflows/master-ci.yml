name: Fleet Master CI

on:
  workflow_call:
    inputs:
      go_version:
        required: false
        type: string
        default: '1.25'
      python_version:
        required: false
        type: string
        default: '3.12'
      run_make:
        required: false
        type: boolean
        default: true

jobs:
  verify:
    name: Fleet Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Go Setup & Verification
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: true

      - name: Go Format Check
        run: if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then echo "Unformatted files found"; gofmt -d .; exit 1; fi

      - name: Run golangci-lint
        if: hashFiles('**/*.go') != ''
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      # 2. Python Setup (Conditional)
      - name: Set up Python
        if: hashFiles('**/requirements.txt', '**/setup.py', '**/pyproject.toml') != ''
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      # 3. Dynamic Test Execution
      - name: Run Tests (Makefile)
        if: inputs.run_make && hashFiles('Makefile') != ''
        run: make test

      - name: Run Tests (Go Native)
        if: hashFiles('Makefile') == '' && hashFiles('**/*.go') != ''
        run: go test -v -race ./...

      - name: Run Tests (Python Native)
        if: hashFiles('Makefile') == '' && hashFiles('**/requirements.txt', '**/setup.py', '**/pyproject.toml') != ''
        run: |
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pytest

      # 4. Global Sandbox Integration Dispatch
      - name: Trigger Sandbox Verification
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          echo "📡 Dispatching fleet-event to sandbox-testing..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FLEET_ACCESS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Bastien-Antigravity/sandbox-testing/dispatches \
            -d '{"event_type": "fleet-event", "client_payload": {"repo": "${{ github.repository }}", "branch": "${{ github.ref_name }}"}}'
