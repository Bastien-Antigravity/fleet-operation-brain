name: Fleet Python CI

on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        type: string
        default: '.'
      python_version:
        required: false
        type: string
        default: '3.12'
      go_version:
        required: false
        type: string
        default: '1.25'

jobs:
  verify:
    name: Python Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go (For CGO Bridge)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      - name: Download Core Library (If Native Provider)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: libdistconf
          path: distributed-config/distconf/libdistconf/

      - name: Checkout Distributed Config (If External Consumer)
        if: github.repository != 'Bastien-Antigravity/distributed-config'
        uses: actions/checkout@v4
        with:
          repository: Bastien-Antigravity/distributed-config
          path: distributed-config
          ref: develop

      - name: Build Distributed Config Library (If External Consumer)
        if: github.repository != 'Bastien-Antigravity/distributed-config'
        working-directory: distributed-config
        run: make build-lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Build CGO Bridges
        run: |
          if grep -q "^core:" Makefile 2>/dev/null; then make core; elif grep -q "^build:" Makefile 2>/dev/null; then make build; fi

      - name: Test Python SDK
        env:
          LIBDISTCONF_PATH: ${{ github.repository == 'Bastien-Antigravity/distributed-config' && format('{0}/distconf/libdistconf/libdistconf.so', github.workspace) || format('{0}/distributed-config/distconf/libdistconf/libdistconf.so', github.workspace) }}
        run: |
          pip install pytest build setuptools wheel
          if [ -f setup.py ]; then python setup.py build_go; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pytest
